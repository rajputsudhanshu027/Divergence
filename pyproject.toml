[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-planner"
version = "0.1.0"
description = "An honest, reproducible retail forecasting and replenishment study"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
retail-planner = "retail_planner.cli:main"

[project.optional-dependencies]
ml = ["numpy>=2.0", "lightgbm>=4.6", "optuna>=4.5"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["retail_planner*"]

[tool.setuptools.package-data]
"retail_planner.analysis" = ["sql/*.sql"]
"retail_planner.presentation" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
