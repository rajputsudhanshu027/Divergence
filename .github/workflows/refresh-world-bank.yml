name: Refresh World Bank snapshot

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-bank-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependency
        run: python -m pip install "requests>=2.32,<3"

      - name: Fetch and validate the full indicator panel
        run: python scripts/refresh_world_bank.py

      - name: Commit the current snapshot
        run: |
          git add -A data/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh World Bank snapshot"
            git push
          else
            echo "Snapshot is unchanged; no commit needed."
          fi
